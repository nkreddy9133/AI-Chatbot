<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>AI Chat Project</title>

        <link rel="stylesheet" href="/static/styles.css">
    </head>

    <body>
        <div class="app-container">
            <h1>AI Chat Project</h1>

            <p class="subtitle">
                Streaming AI assistant built with FastAPI
            </p>

            <div id="chatMessages" class="chat-messages"></div>

            <form id="chatForm">
                <textarea id="messageInput" placeholder="Ask Something..." rows="3" required></textarea>

                <div class="actions">
                    <button type="submit" id="sendButton">
                        Send
                    </button>
                    <button type="button" id="newConversationButton">
                        New Conversation
                    </button>
                </div>
            </form>
            <p id="statusText" class="status"></p>
        </div>
        <script src="/static/app.js"></script>
    </body>
</html>
